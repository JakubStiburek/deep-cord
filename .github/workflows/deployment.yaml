name: Deployment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  migrate:
    name: Migrate Production Database
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.15.0/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version  # Verify installation

      - name: Install dependencies
        working-directory: ./api
        run: pnpm install

      - name: Run Database Migration
        working-directory: ./api
        env:
          NEON_CONNECTION_URL: ${{ secrets.NEON_CONNECTION_URL }}
        run: pnpm run db:prod:migrate

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Deploy Webhook
        run: curl "https://api.render.com/deploy/srv-ctqkmsbqf0us73estr6g?key=${{ secrets.RENDER_API_KEY }}"
